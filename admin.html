<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت فاطیما</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;font-family:Tahoma,Arial,sans-serif;color:#222}
.box{max-width:600px;margin:40px auto;padding:25px;background:#fff;border-radius:16px;box-shadow:0 5px 25px #0001}
h1{text-align:center;margin-top:0}
input,textarea{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #ddd;border-radius:9px;font:inherit}
button{width:100%;padding:13px;border:0;border-radius:9px;background:#111;color:#fff;font:inherit;cursor:pointer}
button:active{transform:scale(.99)}
.hidden{display:none}
.msg{text-align:center;margin:14px 0;min-height:22px}
.product{border:1px solid #ddd;padding:14px;margin-top:12px;border-radius:10px}
.delete{background:#b00020;margin-top:10px}
</style>
</head>
<body>
<div class="box">

<section id="loginBox">
<h1>پنل مدیریت فاطیما</h1>
<p style="text-align:center">ورود مدیر</p>
<input id="password" type="password" placeholder="رمز مدیریت">
<button id="loginButton" type="button">ورود</button>
<div id="loginMessage" class="msg"></div>
</section>

<section id="adminBox" class="hidden">
<h1>مدیریت محصولات</h1>

<input id="name" placeholder="نام محصول">
<input id="price" type="number" placeholder="قیمت">
<input id="colors" placeholder="رنگ‌ها">
<input id="image" placeholder="لینک تصویر محصول">
<textarea id="description" placeholder="توضیحات محصول"></textarea>

<button id="addButton" type="button">افزودن محصول</button>
<div id="message" class="msg"></div>

<hr>
<h2>محصولات</h2>
<div id="products"></div>
</section>

</div>

<script>
(function () {
  "use strict";

  let token = "";

  const $ = (id) => document.getElementById(id);

  async function login() {
    const password = $("password").value.trim();
    const message = $("loginMessage");

    if (!password) {
      message.textContent = "رمز مدیریت را وارد کنید.";
      return;
    }

    message.textContent = "در حال ورود...";

    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({password})
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok || !data.ok) {
        message.textContent = data.error || "ورود ناموفق بود.";
        return;
      }

      token = data.token;

      $("loginBox").classList.add("hidden");
      $("adminBox").classList.remove("hidden");

      await loadProducts();

    } catch (error) {
      message.textContent = "اتصال به سرور برقرار نشد.";
      console.error(error);
    }
  }

  async function loadProducts() {
    const box = $("products");
    box.innerHTML = "در حال دریافت محصولات...";

    try {
      const response = await fetch("/api/products");
      const products = await response.json();

      if (!Array.isArray(products) || products.length === 0) {
        box.innerHTML = "<p>هنوز محصولی ثبت نشده است.</p>";
        return;
      }

      box.innerHTML = products.map(p => `
        <div class="product">
          <strong>${escapeHtml(p.name || "")}</strong>
          <br>
          قیمت: ${Number(p.price || 0).toLocaleString("fa-IR")} تومان
          <br>
          رنگ: ${escapeHtml(p.colors || "-")}
          <button class="delete" type="button" data-id="${p.id}">حذف محصول</button>
        </div>
      `).join("");

      document.querySelectorAll(".delete").forEach(btn => {
        btn.addEventListener("click", () => deleteProduct(btn.dataset.id));
      });

    } catch (error) {
      box.innerHTML = "<p>خطا در دریافت محصولات.</p>";
      console.error(error);
    }
  }

  async function addProduct() {
    const message = $("message");

    const product = {
      name: $("name").value.trim(),
      price: $("price").value,
      colors: $("colors").value.trim(),
      image: $("image").value.trim(),
      description: $("description").value.trim()
    };

    if (!product.name) {
      message.textContent = "نام محصول را وارد کنید.";
      return;
    }

    message.textContent = "در حال ثبت...";

    try {
      const response = await fetch("/api/products", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + token
        },
        body: JSON.stringify(product)
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        message.textContent = data.error || "خطا در ثبت محصول.";
        return;
      }

      message.textContent = "محصول با موفقیت اضافه شد.";

      $("name").value = "";
      $("price").value = "";
      $("colors").value = "";
      $("image").value = "";
      $("description").value = "";

      await loadProducts();

    } catch (error) {
      message.textContent = "خطا در اتصال به سرور.";
      console.error(error);
    }
  }

  async function deleteProduct(id) {
    try {
      const response = await fetch("/api/products/" + encodeURIComponent(id), {
        method: "DELETE",
        headers: {"Authorization": "Bearer " + token}
      });

      if (response.ok) {
        await loadProducts();
      } else {
        const data = await response.json().catch(() => ({}));
        $("message").textContent = data.error || "حذف انجام نشد.";
      }
    } catch (error) {
      $("message").textContent = "خطا در اتصال به سرور.";
      console.error(error);
    }
  }

  function escapeHtml(value) {
    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  $("loginButton").addEventListener("click", login);
  $("password").addEventListener("keydown", (event) => {
    if (event.key === "Enter") login();
  });
  $("addButton").addEventListener("click", addProduct);
})();
</script>
</body>
</html>
