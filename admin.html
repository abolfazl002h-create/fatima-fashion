<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت مزون فاطیما</title><style>
body{font-family:Tahoma;background:#f6f2ee;margin:0;color:#29211d}.wrap{max-width:850px;margin:auto;padding:25px}.box{background:#fff;border:1px solid #e5dbd2;border-radius:18px;padding:22px;margin-bottom:20px}input,textarea{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}button{background:#8a6651;color:#fff;border:0;border-radius:10px;padding:12px 20px;cursor:pointer}.danger{background:#9b3d35}.item{border-top:1px solid #eee;padding:14px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}
</style></head><body><div class="wrap"><h1>پنل مدیریت فاطیما</h1><div class="box" id="login"><h3>ورود مدیر</h3><input id="pass" type="password" placeholder="رمز مدیر"><button onclick="login()">ورود</button><p id="msg"></p></div><div class="box" id="panel" style="display:none"><h2>افزودن محصول</h2><input id="name" placeholder="نام محصول"><input id="price" type="number" placeholder="قیمت (تومان)"><input id="colors" placeholder="رنگ‌ها"><input id="image" placeholder="آدرس مستقیم عکس محصول"><textarea id="description" placeholder="توضیحات"></textarea><button onclick="add()">افزودن محصول</button><p id="status"></p><h2>محصولات موجود</h2><div id="list"></div></div></div>
<script>
let token='';
async function login(){let p=document.querySelector('#pass').value;let r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:p})});let d=await r.json();if(d.ok){token=d.token;document.querySelector('#login').style.display='none';document.querySelector('#panel').style.display='block';load()}else document.querySelector('#msg').textContent='رمز نادرست است.'}
async function add(){let body={name:name.value,price:price.value,colors:colors.value,image:image.value,description:description.value};let r=await fetch('/api/products',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+token},body:JSON.stringify(body)});let d=await r.json();status.textContent=d.ok?'محصول اضافه شد.':'خطا: '+(d.error||'نامشخص');if(d.ok)load()}
async function load(){let r=await fetch('/api/products');let p=await r.json();list.innerHTML=p.map(x=>`<div class="item"><span>${x.name} - ${Number(x.price).toLocaleString('fa-IR')} تومان</span><button class="danger" onclick="del(${x.id})">حذف</button></div>`).join('')||'محصولی ثبت نشده.'}
async function del(id){let r=await fetch('/api/products/'+id,{method:'DELETE',headers:{authorization:'Bearer '+token}});if(r.ok)load()}
</script></body></html>
