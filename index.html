<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مزون فاطیما</title><style>
body{margin:0;font-family:Tahoma,Arial;background:#f8f4ef;color:#29211d}header{padding:22px;text-align:center;background:#29211d;color:#fff}main{max-width:1000px;margin:auto;padding:30px}.hero{text-align:center;padding:55px 15px}.hero h1{font-size:42px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:white;border:1px solid #e6ddd5;border-radius:18px;padding:20px}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#eee}.price{font-weight:bold;color:#8a6651}.btn{display:inline-block;background:#8a6651;color:#fff;padding:10px 18px;border-radius:22px;text-decoration:none;margin-top:10px}
</style></head><body><header><h2>مزون فاطیما</h2></header><main><section class="hero"><h1>استایل خاص، انتخاب مطمئن</h1><p>پوشاک وارداتی و مدل‌های جدید</p><a class="btn" href="https://instagram.com/hedayati__fatima">اینستاگرام</a></section><h2>محصولات</h2><div id="products" class="products"></div></main>
<script>
async function load(){let r=await fetch('/api/products');let p=await r.json();document.querySelector('#products').innerHTML=p.map(x=>`<article class="card"><img src="${x.image||''}" alt="${x.name}"><h3>${x.name}</h3><div class="price">${Number(x.price||0).toLocaleString('fa-IR')} تومان</div><p>${x.description||''}</p><div>رنگ: ${x.colors||'استعلام'}</div><a class="btn" href="https://wa.me/989121069540?text=${encodeURIComponent('سلام، درباره محصول '+x.name+' سوال دارم.')}" target="_blank">سفارش در واتساپ</a></article>`).join('')||'<p>هنوز محصولی اضافه نشده است.</p>'}load();
</script></body></html>
